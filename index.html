<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rail Runner 3D — 无尽跑酷</title>
<style>
  :root{ --accent:#ffd23f; --accent2:#ff5c7a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;user-select:none;}
  #cv{display:block;width:100%;height:100%;touch-action:none;}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .hidden{display:none !important;}
  #start,#pause,#over{background:radial-gradient(120% 120% at 50% 0%,rgba(12,20,44,.72),rgba(6,10,26,.92));backdrop-filter:blur(3px);}
  .panel{width:min(92vw,520px);padding:28px 26px 24px;border-radius:22px;
    background:linear-gradient(160deg,rgba(30,44,90,.92),rgba(14,20,44,.92));
    border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);text-align:center;}
  h1{margin:.1em 0 .15em;font-size:clamp(28px,7vw,46px);letter-spacing:2px;font-weight:900;
     background:linear-gradient(90deg,#ffd23f,#ff8a3d 45%,#ff5c7a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 3px 0 rgba(0,0,0,.25);}
  .sub{opacity:.8;font-size:14px;margin:0 0 18px;letter-spacing:1px;}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;text-align:left;font-size:14px;margin:12px auto 20px;max-width:360px;opacity:.95;}
  .keycap{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:4px 9px;border-radius:8px;font-weight:700;font-size:13px;
     background:linear-gradient(180deg,#4a5a90,#2b3560);border:1px solid rgba(255,255,255,.22);box-shadow:0 2px 0 rgba(0,0,0,.4);}
  .btn{cursor:pointer;border:none;border-radius:14px;padding:14px 30px;font-size:18px;font-weight:800;letter-spacing:1px;color:#20140a;
     background:linear-gradient(180deg,#ffe173,#ffb22e);box-shadow:0 8px 20px rgba(255,170,40,.45), inset 0 1px 0 rgba(255,255,255,.6);transition:transform .08s,filter .15s;}
  .btn:hover{filter:brightness(1.06);} .btn:active{transform:translateY(2px) scale(.99);}
  .btn.ghost{background:linear-gradient(180deg,#5b6aa8,#37416e);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35);}
  .btnrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .best{margin-top:14px;font-size:14px;opacity:.85;} .best b{color:var(--accent);font-size:18px;}
  .stat{display:flex;justify-content:space-between;font-size:16px;padding:9px 6px;border-bottom:1px dashed rgba(255,255,255,.14);} .stat b{font-variant-numeric:tabular-nums;}
  .bigscore{font-size:clamp(34px,9vw,54px);font-weight:900;color:#fff;margin:6px 0 4px;font-variant-numeric:tabular-nums;}
  .badge{display:inline-block;margin:8px auto 2px;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#ff5c7a,#ffa53d);color:#fff;animation:pulse 1s infinite alternate;}
  @keyframes pulse{from{transform:scale(1);} to{transform:scale(1.08);}}
  #hud{pointer-events:none;justify-content:flex-start;}
  .hudTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 16px;gap:10px;}
  .chip{background:linear-gradient(180deg,rgba(10,16,34,.66),rgba(10,16,34,.42));border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:8px 13px;display:flex;align-items:center;gap:9px;box-shadow:0 6px 18px rgba(0,0,0,.28);}
  .col{display:flex;flex-direction:column;gap:8px;align-items:flex-start;} .col.r{align-items:flex-end;}
  .num{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;}
  .lbl{font-size:11px;opacity:.7;letter-spacing:1px;}
  .dot{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);}
  .dot.coin2{background:radial-gradient(circle at 35% 35%,#fff2a8,#ffbf23 60%,#e59400);} .dot.sc{background:radial-gradient(circle at 35% 35%,#cfe9ff,#5aa9ff 60%,#2b6fd6);}
  .dot.sp{background:radial-gradient(circle at 35% 35%,#cffff0,#3ee0b0 60%,#12a377);}
  #powers{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .pw{display:flex;align-items:center;gap:8px;background:rgba(8,14,30,.6);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:5px 9px;}
  .pw .bar{width:78px;height:8px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;}
  .pw .bar i{display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,#ffd23f,#ff8a3d);}
  .pw .tag{font-size:11px;font-weight:800;letter-spacing:.5px;}
  #pauseBtn{pointer-events:auto;position:absolute;top:14px;left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(40,54,102,.85),rgba(20,28,58,.85));color:#fff;font-size:18px;font-weight:900;cursor:pointer;}
  .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;opacity:.55;letter-spacing:1px;}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="start" class="overlay">
  <div class="panel">
    <h1>RAIL RUNNER 3D</h1>
    <p class="sub">三条铁轨 · 无尽奔跑 · 躲避列车与横杆</p>
    <div class="keys">
      <span class="keycap">← →</span><span>切换车道（或 A / D）</span>
      <span class="keycap">↑ / 空格</span><span>跳跃，越过矮栏</span>
      <span class="keycap">↓</span><span>翻滚下滑，钻过横杆</span>
      <span class="keycap">P / Esc</span><span>暂停 · 触屏可四向滑动</span>
    </div>
    <button class="btn" id="startBtn">开 始 奔 跑</button>
    <div class="best">历史最高分：<b id="best0">0</b></div>
  </div>
</div>

<div id="hud" class="overlay hidden">
  <div class="hudTop">
    <div class="col">
      <div class="chip"><span class="dot sc"></span><div><div class="lbl">分数</div><div class="num" id="score">0</div></div></div>
      <div class="chip"><span class="dot coin2"></span><div><div class="lbl">金币</div><div class="num" id="coins">0</div></div></div>
    </div>
    <div class="col r">
      <div class="chip"><div style="text-align:right"><div class="lbl">速度</div><div class="num" id="speed">16</div></div></div>
      <div id="powers">
        <div class="pw hidden" id="pw-magnet"><span class="dot sp"></span><span class="tag">磁铁</span><div class="bar"><i></i></div></div>
        <div class="pw hidden" id="pw-spring"><span class="dot sp"></span><span class="tag">弹力鞋</span><div class="bar"><i></i></div></div>
        <div class="pw hidden" id="pw-shield"><span class="dot sp"></span><span class="tag">护盾</span><div class="bar"><i></i></div></div>
      </div>
    </div>
  </div>
  <button id="pauseBtn" title="暂停">❚❚</button>
  <div class="hint">← → 变道 · ↑ 跳 · ↓ 滚 · P 暂停</div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h1 style="font-size:36px">已 暂 停</h1>
    <div class="btnrow" style="margin-top:18px">
      <button class="btn" id="resumeBtn">继续</button>
      <button class="btn ghost" id="restartBtn2">重新开始</button>
    </div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <h1 style="font-size:34px">GAME OVER</h1>
    <div id="recordWrap" class="hidden"><div class="badge">★ 新纪录 ★</div></div>
    <div class="bigscore" id="finalScore">0</div>
    <div class="stat"><span>本局金币</span><b id="finalCoins">0</b></div>
    <div class="stat"><span>历史最高分</span><b id="finalBest">0</b></div>
    <div class="btnrow" style="margin-top:18px">
      <button class="btn" id="restartBtn">再 来 一 局</button>
    </div>
    <div class="best" style="margin-top:10px">提示：列车只能变道躲避，矮栏要跳、横杆要滚</div>
  </div>
</div>

<script>
(function(){
'use strict';
/* =========================================================================
   Rail Runner 3D — 单文件无尽跑酷 (Canvas 伪3D, 零外部依赖)
   世界: x=横向(车道), y=离地高度, z=前方。玩家固定在 z=0，物体向 -z 滚动。
   ========================================================================= */

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=randInt(0,i);const t=a[i];a[i]=a[j];a[j]=t;}return a;}

const CFG={
  LANE_W:2.2, GAUGE:1.32, SLEEPER_SP:1.5,
  CAM_Z:-9.5, CAM_Y:4.2, CY_FRAC:0.42, CAM_FOLLOW:0.35, FAR:220, NEAR_DZ:1.0,
  P_HW:0.42, P_HD:0.5, STAND_H:1.72, ROLL_H:0.92,
  G:40, JUMP_V:12.2, SPRING_MUL:1.28, SWITCH:0.15, ROLL:0.6,
  SPEED0:16, ACCEL:0.32, SPEED_MAX:44, SHIELD_MUL:1.35,
  SPAWN_Z:150, REMOVE_Z:-9,
  COIN_VAL:5, COIN_SP:1.6,
  MAGNET_R:7, MAGNET_T:7, SPRING_T:9, SHIELD_T:6, POWER_DELAY:16
};
const STEP=1/120;

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  G.f=Math.min(W*0.9,H*0.95);
  G.cx=W/2; G.cy=H*CFG.CY_FRAC;
}
window.addEventListener('resize',resize);

const AC=window.AudioContext||window.webkitAudioContext; let actx=null;
function initAudio(){ if(!actx&&AC){try{actx=new AC();}catch(e){}} }
function beep(f,d,type,vol){ if(!actx)return; try{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=vol||0.045;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+(d||0.1));o.stop(actx.currentTime+(d||0.1)+0.02);}catch(e){} }

function getBest(){try{return parseInt(localStorage.getItem('railrunner.best')||'0',10)||0;}catch(e){return 0;}}
function setBest(v){try{localStorage.setItem('railrunner.best',String(v));}catch(e){}}

const G={
  state:'start', f:600,cx:0,cy:0, camX:0, travel:0, time:0, speed:CFG.SPEED0, mult:1, score:0, coins:0,
  shake:0, acc:0, last:0, phase:0,
  player:null, obstacles:[], coinsArr:[], powerups:[], scenery:[], particles:[], intents:[],
  power:{magnet:0,spring:0,shield:0}, nextRow:0, nextCoin:0, powerTimer:CFG.POWER_DELAY
};
function makePlayer(){ return {lane:0,x:0,y:0,vy:0,mode:'run',rollT:0,sw:{from:0,to:0,t:1}}; }
function reset(){
  G.travel=0;G.time=0;G.speed=CFG.SPEED0;G.mult=1;G.score=0;G.coins=0;G.shake=0;G.acc=0;G.camX=0;G.phase=0;
  G.player=makePlayer(); G.obstacles.length=0;G.coinsArr.length=0;G.powerups.length=0;G.particles.length=0;G.intents.length=0;
  G.power={magnet:0,spring:0,shield:0};
  G.nextRow=26; G.nextCoin=18; G.powerTimer=CFG.POWER_DELAY; G.scenery.length=0;
  for(let i=0;i<28;i++) addScenery(rand(10,CFG.SPAWN_Z));
}

function proj(x,y,z){
  const dz=z-CFG.CAM_Z;
  if(dz<CFG.NEAR_DZ*0.5) return null;
  const s=G.f/dz;
  return {sx:G.cx+(x-G.camX)*s, sy:G.cy-(y-CFG.CAM_Y)*s, s:s, dz:dz};
}

function laneX(l){return l*CFG.LANE_W;}
function blockedLanesAt(z){
  const res=[];
  for(const o of G.obstacles){ if(o.type==='train'){ if(Math.abs(o.z-z)<o.len/2+0.9) res.push(o.lane); } }
  return res;
}
function addTrain(lane){
  const moving=Math.random()<0.35;
  G.obstacles.push({type:'train',lane:lane,z:CFG.SPAWN_Z,len:moving?rand(9,15):rand(6,11),moving:moving,extra:moving?rand(8,16):0,seed:Math.random(),ignored:false});
}
function addBar(lane){ G.obstacles.push({type:Math.random()<0.55?'low':'high',lane:lane,z:CFG.SPAWN_Z,len:0.7,ignored:false,seed:Math.random()}); }
function spawnRow(){
  const z=CFG.SPAWN_Z;
  const blocked=blockedLanesAt(z);
  const free=[0,1,2].filter(l=>blocked.indexOf(l)<0);
  const pTrain=Math.min(0.5,0.16+G.time*0.004);
  if(Math.random()<pTrain){
    const maxAdd=Math.max(0,2-blocked.length);
    if(maxAdd>=1&&free.length>=1){
      let n=Math.min(free.length,maxAdd,Math.random()<0.5?1:2);
      shuffle(free);
      for(let i=0;i<n;i++) addTrain(free[i]);
    }
  }else{
    if(blocked.length>=2) return;               // 至少保留一条完全空旷的车道
    let n=Math.min(free.length,Math.random()<0.45?2:1);
    shuffle(free);
    for(let i=0;i<n;i++) addBar(free[i]);
  }
}
function spawnCoinString(){
  const lane=randInt(-1,1);
  const n=randInt(5,8); const arc=Math.random()<0.35;
  for(let i=0;i<n;i++){
    const t=n>1?i/(n-1):0;
    G.coinsArr.push({lane:lane,x:laneX(lane),y:arc?0.7+Math.sin(t*Math.PI)*1.9:0.75,z:CFG.SPAWN_Z+i*CFG.COIN_SP,dead:false,seed:Math.random()});
  }
}
function spawnPowerup(){ G.powerups.push({lane:randInt(-1,1),x:0,y:1.0,z:CFG.SPAWN_Z,type:['magnet','spring','shield'][randInt(0,2)],seed:Math.random()}); G.powerups[G.powerups.length-1].x=laneX(G.powerups[G.powerups.length-1].lane); }
function addScenery(z){
  const side=Math.random()<0.5?-1:1, r=Math.random();
  if(r<0.55){ const hw=rand(1.4,3.2),h=rand(4,15); G.scenery.push({type:'building',x:side*rand(6.5,17),hw:hw,hd:hw,base:0,h:h,z:z,col:['#5b6ea6','#6d7fb8','#4a5b8c','#7b86b5','#8a6fa6','#5f7f9a','#6a7f6a'][randInt(0,6)],seed:Math.random()}); }
  else if(r<0.8){ G.scenery.push({type:'pole',x:side*rand(4.6,5.2),hw:0.14,hd:0.14,base:0,h:rand(6,8),z:z,side:side,seed:Math.random()}); }
  else{ G.scenery.push({type:'wall',x:side*rand(4.3,5.0),hw:rand(1.6,3.0),hd:0.1,base:0,h:rand(1.8,2.6),z:z,seed:Math.random(),hue:rand(0,360)}); }
}

// ---------------- 输入 ----------------
function queue(k){ if(G.state==='playing') G.intents.push(k); }
const KEYMAP={'arrowleft':'left','a':'left','arrowright':'right','d':'right','arrowup':'jump','w':'jump',' ':'jump','spacebar':'jump','arrowdown':'roll','s':'roll'};
window.addEventListener('keydown',function(e){
  initAudio();
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].indexOf(k)>=0) e.preventDefault();
  if(k==='p'||k==='escape'){ togglePause(); return; }
  if(k==='enter'){ if(G.state==='start'||G.state==='over') startGame(); return; }
  const a=KEYMAP[k]; if(a) queue(a);
});
let tStart=null;
cv.addEventListener('pointerdown',function(e){ initAudio(); tStart={x:e.clientX,y:e.clientY,id:e.pointerId}; });
cv.addEventListener('pointerup',function(e){
  if(!tStart||e.pointerId!==tStart.id) return;
  const dx=e.clientX-tStart.x, dy=e.clientY-tStart.y; tStart=null;
  const TH=26; if(Math.abs(dx)<TH&&Math.abs(dy)<TH) return;
  if(Math.abs(dx)>Math.abs(dy)) queue(dx>0?'right':'left'); else queue(dy>0?'roll':'jump');
});
cv.addEventListener('pointercancel',function(){tStart=null;});

// ---------------- 状态 ----------------
const $=id=>document.getElementById(id);
const elStart=$('start'),elHud=$('hud'),elPause=$('pause'),elOver=$('over');
function show(el,on){ el.classList.toggle('hidden',!on); }
function startGame(){ reset(); G.state='playing'; G.last=0; show(elStart,false);show(elOver,false);show(elPause,false);show(elHud,true); $('recordWrap').classList.add('hidden'); beep(660,0.09,'square'); }
function togglePause(){
  if(G.state==='playing'){ G.state='paused'; show(elPause,true); show(elHud,false); }
  else if(G.state==='paused'){ G.state='playing'; G.last=0; show(elPause,false); show(elHud,true); }
}
function gameOver(){
  G.state='over'; G.shake=1;
  const best=getBest(); const isRecord=G.score>best; if(isRecord) setBest(G.score);
  $('finalScore').textContent=G.score; $('finalCoins').textContent=G.coins; $('finalBest').textContent=Math.max(best,G.score);
  show($('recordWrap'),isRecord); show(elHud,false); show(elOver,true); beep(180,0.35,'sawtooth',0.07);
}
$('startBtn').onclick=()=>{initAudio();startGame();};
$('restartBtn').onclick=()=>startGame();
$('restartBtn2').onclick=()=>startGame();
$('resumeBtn').onclick=()=>togglePause();
$('pauseBtn').onclick=()=>togglePause();
window.addEventListener('blur',()=>{ if(G.state==='playing') togglePause(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G.state==='playing') togglePause(); });

// ---------------- 更新 ----------------
function handleIntent(k){
  const p=G.player;
  if(k==='left'||k==='right'){
    const dir=k==='left'?-1:1; const target=clamp(p.lane+dir,-1,1);
    if(target!==p.lane){ p.lane=target; p.sw.from=p.x; p.sw.to=laneX(target); p.sw.t=0; beep(440,0.05,'triangle',0.03); }
  }else if(k==='jump'){ if(p.mode==='run'){ p.mode='jump'; p.vy=CFG.JUMP_V*(G.power.spring>0?CFG.SPRING_MUL:1); beep(520,0.09,'triangle',0.04);} }
  else if(k==='roll'){ if(p.mode==='run'){ p.mode='roll'; p.rollT=CFG.ROLL; beep(300,0.09,'sawtooth',0.035);} else if(p.mode==='jump'){ p.vy=Math.min(p.vy,-6); } }
}
function dust(x,y,z){ G.particles.push({x:x,y:y,z:z,vx:rand(-0.7,0.7),vy:rand(0.4,1.6),vz:rand(-0.4,0.4),life:rand(0.25,0.5),size:rand(0.05,0.14),col:'rgba(220,215,200,'}); }
function burst(o){ for(let i=0;i<18;i++) G.particles.push({x:laneX(o.lane),y:rand(0.5,2),z:o.z,vx:rand(-3,3),vy:rand(1,5),vz:rand(-2,2),life:rand(0.3,0.7),size:rand(0.06,0.16),col:'rgba(120,220,255,'}); }
function sparkle(x,y,z){ for(let i=0;i<6;i++) G.particles.push({x:x,y:y,z:z,vx:rand(-1,1),vy:rand(0.5,2.5),vz:rand(-1,1),life:rand(0.2,0.45),size:rand(0.04,0.1),col:'rgba(255,220,90,'}); }

function playerBox(){ const p=G.player; const h=(p.mode==='roll')?CFG.ROLL_H:CFG.STAND_H; return {x0:p.x-CFG.P_HW,x1:p.x+CFG.P_HW,y0:p.y,y1:p.y+h,z0:-CFG.P_HD,z1:CFG.P_HD}; }
function collide(){
  const b=playerBox();
  for(const o of G.obstacles){
    if(o.ignored||Math.abs(o.z)>4) continue;
    let ob;
    if(o.type==='train'){ const hw=CFG.LANE_W/2-0.05; ob={x0:laneX(o.lane)-hw,x1:laneX(o.lane)+hw,y0:0,y1:2.6,z0:o.z-o.len/2,z1:o.z+o.len/2}; }
    else if(o.type==='low'){ ob={x0:laneX(o.lane)-0.85,x1:laneX(o.lane)+0.85,y0:0,y1:0.8,z0:o.z-0.35,z1:o.z+0.35}; }
    else { ob={x0:laneX(o.lane)-0.9,x1:laneX(o.lane)+0.9,y0:1.05,y1:2.45,z0:o.z-0.35,z1:o.z+0.35}; }
    if(b.x0<ob.x1&&b.x1>ob.x0&&b.y0<ob.y1&&b.y1>ob.y0&&b.z0<ob.z1&&b.z1>ob.z0){

function collectCoins(){
  const p=G.player;
  for(const c of G.coinsArr){ if(c.dead||Math.abs(c.z)>1.2) continue; const dx=p.x-c.x,dy=(p.y+0.9)-c.y; if(Math.abs(dx)<0.85&&Math.abs(dy)<1.4){ c.dead=true;G.coins++;beep(880,0.06,'triangle',0.03);sparkle(c.x,c.y,c.z);} }
}
function collectPowerups(){
  const p=G.player;
  for(const u of G.powerups){ if(u.dead||Math.abs(u.z)>1.3) continue; const dx=p.x-u.x,dy=(p.y+0.9)-u.y; if(Math.abs(dx)<0.95&&Math.abs(dy)<1.6){ u.dead=true; G.power[u.type]=Math.max(G.power[u.type],{magnet:CFG.MAGNET_T,spring:CFG.SPRING_T,shield:CFG.SHIELD_T}[u.type]); beep(700,0.15,'sine',0.05); burst({lane:u.lane,z:u.z}); } }
}

function update(dt){
  const p=G.player;
  G.time+=dt;
  let sp=Math.min(CFG.SPEED_MAX,CFG.SPEED0+G.time*CFG.ACCEL); if(G.power.shield>0) sp*=CFG.SHIELD_MUL;
  G.speed=sp; G.mult=1+clamp((sp-CFG.SPEED0)/(CFG.SPEED_MAX-CFG.SPEED0),0,1)*0.5;
  G.travel+=G.speed*dt; G.phase+=dt*(6+G.speed*0.25);

  for(const it of G.intents) handleIntent(it); G.intents.length=0;

  if(p.sw.t<1){ p.sw.t=Math.min(1,p.sw.t+dt/CFG.SWITCH); p.x=lerp(p.sw.from,p.sw.to,ease(p.sw.t)); }
  if(p.mode==='jump'){ p.vy-=CFG.G*dt; p.y+=p.vy*dt; if(p.y<=0){ p.y=0;p.vy=0;p.mode='run'; for(let i=0;i<8;i++) dust(p.x,0,0);} }
  if(p.mode==='roll'){ p.rollT-=dt; if(p.rollT<=0) p.mode='run'; }

  G.camX+=((p.x*CFG.CAM_FOLLOW)-G.camX)*Math.min(1,dt*9);

  if(G.travel>=G.nextRow){ spawnRow(); G.nextRow=G.travel+clamp(G.speed*0.95,15,40)*rand(0.9,1.25); }
  if(G.travel>=G.nextCoin){ spawnCoinString(); G.nextCoin=G.travel+rand(16,30); }
  G.powerTimer-=dt; if(G.powerTimer<=0){ spawnPowerup(); G.powerTimer=CFG.POWER_DELAY; }

  for(const o of G.obstacles) o.z-=(G.speed+(o.extra||0))*dt;
  for(const c of G.coinsArr) c.z-=G.speed*dt;
  for(const u of G.powerups) u.z-=G.speed*dt;
  for(const s of G.scenery) s.z-=G.speed*dt;
  if(G.power.magnet>0){
    for(const c of G.coinsArr){ if(c.dead)continue; const dx=p.x-c.x,dy=(p.y+0.9)-c.y,dz=0-c.z; const d=Math.sqrt(dx*dx+dy*dy+dz*dz); if(d<CFG.MAGNET_R&&d>0.001){ const k=Math.min(1,dt*6*(1-d/CFG.MAGNET_R)+dt*3); c.x+=dx*k; c.y+=dy*k; c.z+=dz*k; } }
  }

  G.obstacles=G.obstacles.filter(o=>o.z-(o.len||0)/2>CFG.REMOVE_Z&&!o.dead);
  G.coinsArr=G.coinsArr.filter(c=>c.z>CFG.REMOVE_Z&&!c.dead);
  G.powerups=G.powerups.filter(u=>u.z>CFG.REMOVE_Z&&!u.dead);
  G.scenery=G.scenery.filter(s=>s.z>CFG.REMOVE_Z-4);
  while(G.scenery.length<32) addScenery(CFG.SPAWN_Z+rand(0,24));

  collectCoins(); collectPowerups(); collide();

  for(const k in G.power){ if(G.power[k]>0){ G.power[k]=Math.max(0,G.power[k]-dt); if(G.power[k]===0) beep(240,0.1,'sine',0.03); } }

  for(const q of G.particles){ q.life-=dt; q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt; q.vy-=14*dt; q.z-=G.speed*dt; }
  G.particles=G.particles.filter(q=>q.life>0);
  if(p.mode==='run'&&Math.random()<dt*22) dust(p.x+rand(-0.2,0.2),0.02,0);

  G.score=Math.floor(G.travel*G.mult)+G.coins*CFG.COIN_VAL;
  G.shake=Math.max(0,G.shake-dt*3);
}

  push(0-CFG.CAM_Z,()=>drawPlayer());
  R.sort((a,b)=>b.dz-a.dz); for(const it of R) it.fn();
  drawParticles(); ctx.restore();
  if(G.speed>26&&G.state==='playing'){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,'+clamp((G.speed-26)/40,0,0.35)+')'; ctx.lineWidth=2;
    for(let i=0;i<14;i++){ const a=(i/14)*Math.PI*2+G.travel*0.03; const r1=Math.min(W,H)*0.34,r2=Math.min(W,H)*0.62; ctx.beginPath(); ctx.moveTo(G.cx+Math.cos(a)*r1,G.cy+Math.sin(a)*r1*0.9); ctx.lineTo(G.cx+Math.cos(a)*r2,G.cy+Math.sin(a)*r2*0.9); ctx.stroke(); } ctx.restore(); }
}

let hudTick=0;
function updateHUD(){
  $('score').textContent=G.score; $('coins').textContent=G.coins; $('speed').textContent=Math.round(G.speed);
  for(const k of ['magnet','spring','shield']){ const el=$('pw-'+k), t=G.power[k];
    if(t>0){ el.classList.remove('hidden'); el.querySelector('i').style.width=(t/{magnet:CFG.MAGNET_T,spring:CFG.SPRING_T,shield:CFG.SHIELD_T}[k]*100)+'%'; } else el.classList.add('hidden'); }
}

function visualIdle(dt){ G.travel+=9*dt; G.phase+=dt*7; for(const s of G.scenery){ s.z-=9*dt; if(s.z<CFG.REMOVE_Z-4) s.z+=CFG.SPAWN_Z+30; } G.shake=Math.max(0,G.shake-dt*3); }
function frame(ts){
  requestAnimationFrame(frame);
  if(!G.last) G.last=ts;
  let dt=(ts-G.last)/1000; G.last=ts; if(dt>0.1) dt=0.1;
  if(G.state==='playing'){
    G.acc+=dt; let it=0; while(G.acc>=STEP&&it<8){ update(STEP); G.acc-=STEP; it++; } if(it>=8) G.acc=0;
    hudTick+=dt; if(hudTick>0.08){ hudTick=0; updateHUD(); }
  }else if(G.state==='start'||G.state==='over'){ visualIdle(dt); }
  render();
}

resize(); reset(); G.player=makePlayer(); $('best0').textContent=getBest();
for(let i=0;i<32;i++) addScenery(rand(4,CFG.SPAWN_Z));
requestAnimationFrame(frame);

})();
</script>
